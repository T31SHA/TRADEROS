[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "traderos"
version = "0.1.0"
description = "Trading Research, Execution, Risk & Decision Operating System"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "TRADEROS contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: tests involving adapters or external infrastructure",
    "system: end-to-end application-flow tests",
    "security: security-focused tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
exclude = ["^tests/"]

[tool.coverage.run]
branch = true
source = ["traderos"]

[tool.coverage.report]
show_missing = true
skip_covered = true
